[package]
name = "microtime"
version = "1.0.1"
description = "Local focus sessions with no account required"
authors = ["MicroTime contributors"]
edition = "2021"
license = "MIT"

[lib]
name = "microtime_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["clock", "serde"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
tauri = { version = "2.11.5", features = ["tray-icon", "image-png"] }
tauri-plugin-dialog = "2.7.2"
tauri-plugin-fs = "2.5.1"
tauri-plugin-notification = "2.3.3"
tauri-plugin-sql = { version = "2.4.0", features = ["sqlite"] }
tauri-plugin-window-state = "2.4.1"

[target.'cfg(target_os = "macos")'.dependencies]
objc2 = "0.6.4"
objc2-app-kit = { version = "0.3.2", features = ["NSApplication", "NSImage", "NSRunningApplication", "NSWindow", "NSWorkspace"] }
objc2-foundation = { version = "0.3.2", features = ["NSData", "NSNotification", "NSOperation", "NSString", "block2"] }
block2 = "0.6.2"
